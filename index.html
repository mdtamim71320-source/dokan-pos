<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>আমার দোকান</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b7a3e"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--c:#fff;--t:#111;--m:#555;--p:#0b7a3e;--pt:#fff;--r:#c62828;--b:#c5ccd3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1317;--c:#1a2027;--t:#f4f4f4;--m:#aab3bb;--p:#35c477;--pt:#062;--r:#ff7b7b;--b:#3a444d}}
:root[data-theme=dark]{--bg:#0f1317;--c:#1a2027;--t:#f4f4f4;--m:#aab3bb;--p:#35c477;--pt:#062;--r:#ff7b7b;--b:#3a444d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 'Noto Sans Bengali',system-ui,sans-serif;padding-bottom:72px}
header{background:var(--p);color:var(--pt);padding:12px 14px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5}
main{padding:10px;max-width:720px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px;font:inherit;border:2px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);min-height:48px}
label{display:block;font-size:14px;margin:8px 0 2px;color:var(--m)}
.btn{background:var(--p);color:var(--pt);border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;min-height:48px;cursor:pointer}
.btn.o{background:none;color:var(--p);border:2px solid var(--p)}.btn.r{background:var(--r);color:#fff}.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.row>.f0{flex:0 0 auto}.sp{justify-content:space-between}
.mut{color:var(--m);font-size:14px}.red{color:var(--r);font-weight:700}.big{font-size:22px;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:2px solid var(--b);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);padding:6px 0;font:inherit;font-size:12px}nav button.on{color:var(--p);font-weight:700}nav span{display:block;font-size:20px}
.ov{position:fixed;inset:0;background:#0009;z-index:9;overflow:auto;padding:10px}.box{background:var(--c);border-radius:12px;padding:14px;max-width:480px;margin:10px auto}
.dd{border:2px solid var(--b);border-radius:10px;max-height:220px;overflow:auto;margin-top:8px}.dd div{padding:12px;border-bottom:1px solid var(--b)}
.bd{background:var(--r);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px}
.rc{font-family:monospace;font-size:13px;max-width:80mm;margin:auto;white-space:pre-wrap}
table.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:6px 4px;border-top:1px solid var(--b);text-align:right}.tb td:first-child,.tb th:first-child{text-align:left}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;display:none}
@media print{header,nav,main,#toast,.np{display:none!important}.ov{position:static;background:#fff;padding:0}.box{padding:0;margin:0;background:#fff;color:#000}.rc{color:#000}}
</style></head><body>
<header id="hd"></header><main id="app"></main><nav id="nav"></nav><div id="modal"></div><div id="cam"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),
E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
N=n=>(+n||0).toLocaleString('bn-BD',{maximumFractionDigits:2}),
K='mudir_dokan_v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),
R2=n=>Math.round(n*1000)/1000,A=h=>$('#app').innerHTML=h;
let D={shop:'আমার দোকান',products:[],customers:[],sales:[],ledger:[],lastBackup:0};
try{Object.assign(D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
D.products.forEach(p=>{if(p.qty<0)p.qty=0});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function save(){try{snap()}catch(e){}try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('সেভ হচ্ছে না! এখনই ব্যাকআপ নিন')}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#modal').innerHTML='<div class="ov"><div class="box">'+h+'</div></div>'}
function closeModal(){$('#modal').innerHTML=''}
function ask(m,fn){modal(`<p>${E(m)}</p><div class="row"><button class="btn o" onclick="closeModal()">না</button><button class="btn r" id="yes">হ্যাঁ</button></div>`);$('#yes').onclick=()=>{closeModal();fn()}}
const T=[['pos','🛒','বিক্রি'],['stock','📦','স্টক'],['baki','📒','বাকি খাতা'],['dash','📊','রিপোর্ট'],['bk','💾','ব্যাকআপ']];
let tab='pos',cart=[],cust='',disc='',paid='',sq='',range='today',d1='',d2='';
let tabHist=[];function go(t,bk){if(!bk&&t!==tab)tabHist.push(tab);tab=t;$('#nav').innerHTML=T.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');$('#hd').textContent='🏪 '+D.shop;({pos:rPos,stock:rStock,baki:rBaki,dash:rDash,bk:rBk})[t]()}

/* ---------- Barcode camera ---------- */
let qr;
const LIBS=['https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js','https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'];
function lib(){return window.Html5Qrcode?Promise.resolve():LIBS.reduce((p,u)=>p.catch(()=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=()=>window.Html5Qrcode?ok():no();s.onerror=no;document.head.appendChild(s)})),Promise.reject())}
let multi=false,lastC='',lastT=0;
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},120)}catch(e){}try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function onMulti(c){const n=Date.now();if(c==lastC&&n-lastT<2000){lastT=n;return}lastC=c;lastT=n;const p=D.products.find(x=>x.barcode==c),s=$('#cs');if(!p){if(s)s.textContent='❌ পণ্য নেই: '+c;return}addCart(p.id);beep();if(s)s.innerHTML='✅ '+E(p.name)+'<br>কার্টে '+N(cart.reduce((a,x)=>a+x.qty,0))+' টি · ৳'+N(tot().t)}
function scanMulti(){lastC='';if(camBlocked())return scan(addCode);multi=true;scan(addCode)}
function camBlocked(){try{const p=document.permissionsPolicy||document.featurePolicy;return !!(p&&p.allowsFeature&&!p.allowsFeature('camera'))}catch(e){return false}}
function scan(cb){if(camBlocked())return photoUI(cb);lib().then(()=>scan2(cb),()=>scanNative(cb))}
let ns;
function scanNative(cb){if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return toast('এই ব্রাউজারে ক্যামেরা স্ক্যান চলছে না — Chrome-এ খুলুন, অথবা বারকোড টাইপ করুন / স্ক্যানার গান ব্যবহার করুন');
$('#cam').innerHTML='<div class="ov" style="z-index:12"><div class="box"><h3>বারকোড স্ক্যান</h3><video id="nv" playsinline muted style="width:100%;border-radius:10px"></video><p class="mut" id="cs" style="font-size:16px"></p><p class="red" id="qe"></p><button class="btn w" onclick="stopNative()">'+(multi?'✅ শেষ করুন':'বন্ধ করুন')+'</button></div></div>';
const det=new BarcodeDetector();
navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'}}}).then(s=>{ns={s,cb};const v=$('#nv');v.srcObject=s;v.play();ns.t=setInterval(()=>det.detect(v).then(r=>{if(r.length&&ns){const c=r[0].rawValue,f=ns.cb;if(multi)onMulti(c);else stopNative(()=>f(c))}}).catch(()=>{}),300)}).catch(()=>photoUI(cb))}
function stopNative(f){multi=false;if(ns){clearInterval(ns.t);ns.s.getTracks().forEach(t=>t.stop());ns=null}$('#cam').innerHTML='';f&&f()}
function scan2(cb){
$('#cam').innerHTML='<div class="ov" style="z-index:12"><div class="box"><h3>বারকোড স্ক্যান</h3><div id="qr"></div><p class="mut" id="cs" style="font-size:16px"></p><p class="red" id="qe"></p><button class="btn w" onclick="stopScan()">'+(multi?'✅ শেষ করুন':'বন্ধ করুন')+'</button></div></div>';
qr=new Html5Qrcode('qr');qr.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:250,height:150}},t=>{if(!qr)return;if(multi)onMulti(t);else stopScan(()=>cb(t))},()=>{}).catch(()=>photoUI(cb))}
function photoUI(cb){multi=false;qr=null;const cam=$('#cam');cam.innerHTML='<div id="pq" style="display:none"></div>';const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.style.display='none';cam.appendChild(i);
i.onchange=async()=>{const f=i.files[0];if(!f)return cam.innerHTML='';try{let c;if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(await createImageBitmap(f));c=r[0]&&r[0].rawValue}if(!c){await lib();c=await new Html5Qrcode('pq').scanFile(f,false)}if(!c)throw 0;cam.innerHTML='';cb(c)}catch(x){cam.innerHTML='';toast('বারকোড পড়া যায়নি — কাছ থেকে, স্পষ্ট করে আবার 📷 চাপুন')}};i.click()}
function stopScan(cb){multi=false;const q=qr;qr=null;const d=()=>{$('#cam').innerHTML='';cb&&cb()};q?q.stop().catch(()=>{}).then(()=>{try{q.clear()}catch(e){}d()}):d()}

/* ---------- POS ---------- */
function rPos(){A(`<div class="card"><div class="row"><input id="sc" placeholder="বারকোড স্ক্যান / টাইপ" inputmode="numeric" autocomplete="off"><button class="btn f0" onclick="scanMulti()">📷</button></div>
<input id="sq" placeholder="🔍 পণ্যের নাম খুঁজুন" style="margin-top:8px" autocomplete="off"><div id="dd"></div></div>
<div class="card" id="cart"></div>
<div class="card"><div class="row"><input type="number" inputmode="decimal" placeholder="ছাড় (৳)" value="${disc}" oninput="disc=this.value;sum()"><input type="number" inputmode="decimal" placeholder="নগদ প্রাপ্ত (খালি=পুরো)" value="${paid}" oninput="paid=this.value;sum()"></div>
<div id="sum" style="margin:10px 0"></div>
<div class="row"><select id="cu" onchange="cust=this.value"></select><button class="btn o f0" onclick="custForm(1)">+ নতুন</button></div>
<button class="btn w" style="margin-top:10px;font-size:18px" onclick="sell()">✅ বিল সম্পন্ন করুন</button></div>`);
fillCu();drawCart();
const sc=$('#sc');sc.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();addCode(sc.value.trim());sc.value=''}};sc.focus();
$('#sq').oninput=e=>{const v=e.target.value.trim().toLowerCase();$('#dd').innerHTML=v?'<div class="dd">'+(D.products.filter(p=>p.name.toLowerCase().includes(v)||p.barcode.includes(v)).slice(0,20).map(p=>`<div onclick="addCart('${p.id}');$('#sq').value='';$('#dd').innerHTML=''">${E(p.name)} <span class="mut">৳${N(p.sell)}/${p.unit} · স্টক ${N(p.qty)}</span></div>`).join('')||'<div class="mut">পাওয়া যায়নি</div>')+'</div>':''}}
function addCode(c){if(!c)return;const p=D.products.find(x=>x.barcode==c);p?addCart(p.id):toast('এই বারকোডের পণ্য নেই')}
function addCart(id){const p=D.products.find(x=>x.id==id);if(!p)return;let c=cart.find(x=>x.id==id);c?c.qty=R2(c.qty+1):cart.push(c={id,name:p.name,unit:p.unit,price:p.sell,buy:p.buy,qty:1});if(c.qty>p.qty)toast('⚠ স্টক কম: '+N(p.qty)+' '+p.unit);drawCart();if(!multi){const s=$('#sc');s&&s.focus()}}
function drawCart(){$('#cart').innerHTML=cart.length?cart.map((c,i)=>`<div style="border-bottom:1px solid var(--b);padding:6px 0"><div class="row sp"><b>${E(c.name)}</b><button class="btn r f0" onclick="cart.splice(${i},1);drawCart()">✕</button></div><div class="row"><input type="number" inputmode="decimal" value="${c.qty}" onchange="cart[${i}].qty=+this.value||0;drawCart()"><span class="f0">${c.unit} ×</span><input type="number" inputmode="decimal" value="${c.price}" onchange="cart[${i}].price=+this.value||0;drawCart()"><b class="f0">৳${N(c.qty*c.price)}</b></div></div>`).join(''):'<p class="mut">কার্ট খালি — বারকোড স্ক্যান করুন বা নাম খুঁজুন</p>';sum()}
function tot(){const s=cart.reduce((a,c)=>a+c.qty*c.price,0),d=Math.min(+disc||0,s),t=s-d,p=paid===''?t:+paid;return{s,d,t,p,ch:Math.max(0,p-t),du:Math.max(0,t-p)}}
function sum(){const x=tot();$('#sum').innerHTML=`<div class="row sp"><span>সাব-টোটাল</span><b>৳${N(x.s)}</b></div><div class="row sp"><span>সর্বমোট</span><span class="big">৳${N(x.t)}</span></div><div class="row sp"><span>ফেরত</span><b>৳${N(x.ch)}</b></div><div class="row sp"><span>বাকি</span><b class="${x.du?'red':''}">৳${N(x.du)}</b></div>`}
function fillCu(){$('#cu').innerHTML='<option value="">কাস্টমার (বাকির জন্য)</option>'+D.customers.map(c=>`<option value="${c.id}" ${c.id==cust?'selected':''}>${E(c.name)}${c.due?' (বাকি ৳'+N(c.due)+')':''}</option>`).join('')}
function sell(){const x=tot();if(!cart.length||cart.some(c=>c.qty<=0))return toast('কার্ট ঠিক করুন');
if(x.du>0&&!cust)return toast('বাকি থাকলে কাস্টমার বেছে নিন');
const bp=sell.ok;sell.ok=0;{const u=D.customers.find(y=>y.id==cust);if(x.du>0&&u&&u.limit>0&&u.due+x.du>u.limit&&!bp)return ask('⚠ বাকির সীমা পেরোচ্ছে! সীমা ৳'+N(u.limit)+', বিলের পরে বাকি হবে ৳'+N(u.due+x.du)+'। তবুও বিল করবেন?',()=>{sell.ok=1;sell()})}
const s={id:uid(),no:D.sales.length+1,ts:Date.now(),items:cart.map(c=>({...c})),sub:x.s,disc:x.d,total:x.t,paid:Math.min(x.p,x.t),due:x.du,cid:cust};
const over=[];cart.forEach(c=>{const p=D.products.find(y=>y.id==c.id);if(p){if(c.qty>p.qty)over.push(p.name);p.qty=Math.max(0,R2(p.qty-c.qty))}});
if(x.du){const u=D.customers.find(y=>y.id==cust);u.due=Math.round((u.due+x.du)*100)/100;D.ledger.push({id:uid(),cid:cust,ts:s.ts,type:'due',amt:x.du,note:'বিল #'+s.no})}
D.sales.push(s);save();if(over.length)setTimeout(()=>toast('⚠ স্টকের চেয়ে বেশি বিক্রি: '+over.join(', ')+' (স্টক ০ করা হলো)'),300);cart=[];disc=paid=cust='';rPos();receipt(s.id)}
function rcText(s){const cu=D.customers.find(c=>c.id==s.cid),L='--------------------------';return [D.shop,'বিল #'+s.no+'  '+new Date(s.ts).toLocaleString('bn-BD'),L,...s.items.map(i=>`${i.name}\n  ${N(i.qty)} ${i.unit} × ${N(i.price)} = ${N(i.qty*i.price)}`),L,'সাব-টোটাল: '+N(s.sub),'ছাড়: '+N(s.disc),'সর্বমোট: '+N(s.total),'জমা: '+N(s.paid),'বাকি: '+N(s.due),cu?'কাস্টমার: '+cu.name:'','ধন্যবাদ!'].filter(Boolean).join('\n')}
function receipt(id){const s=D.sales.find(x=>x.id==id);modal(`<div class="rc">${E(rcText(s))}</div><div class="row np" style="margin-top:12px"><button class="btn" onclick="window.print()">🖨 প্রিন্ট</button><button class="btn o" onclick="shareRc('${id}')">📤 শেয়ার</button><button class="btn o" onclick="closeModal()">বন্ধ</button></div>`)}
function shareRc(id){const t=rcText(D.sales.find(x=>x.id==id));if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('কপি হয়েছে'),()=>toast('কপি করা যায়নি'))}

/* ---------- Stock ---------- */
function rStock(){A(`<div class="card"><div class="row sp"><span>মোট মাল (কেনা দামে)</span><b class="f0">৳${N(stockBuy())}</b></div><div class="row sp"><span>মোট মাল (বিক্রি দামে)</span><b class="f0">৳${N(stockSell())}</b></div><div class="row sp"><span>মোট পণ্য</span><b class="f0">${N(D.products.length)} টি</b></div></div><div class="row"><input id="ss" placeholder="🔍 নাম/বারকোড" value="${E(sq)}" oninput="sq=this.value;lst()"><button class="btn f0" onclick="scan(c=>{sq=c;rStock()})">📷</button><button class="btn f0" onclick="prodForm()">+ নতুন</button></div><div id="sl" style="margin-top:10px"></div>`);lst()}
function lst(){const v=sq.trim().toLowerCase(),L=D.products.filter(p=>!v||p.name.toLowerCase().includes(v)||p.barcode.includes(v));
$('#sl').innerHTML=L.length?L.map(p=>`<div class="card"><div class="row sp"><b>${E(p.name)}</b>${p.qty<5?'<span class="bd f0">কম স্টক</span>':''}</div><div class="mut">বারকোড: ${E(p.barcode)||'—'} · কেনা ৳${N(p.buy)} · বিক্রি ৳${N(p.sell)}</div><div class="row"><span class="big ${p.qty<5?'red':''}">${N(p.qty)} ${p.unit}</span><button class="btn o f0" onclick="addStock('${p.id}')">+ স্টক</button><button class="btn o f0" onclick="prodForm('${p.id}')">এডিট</button></div></div>`).join(''):'<p class="mut">কোনো পণ্য নেই — "+ নতুন" চাপুন</p>'}
function addStock(id){const p=D.products.find(x=>x.id==id);modal(`<h3>${E(p.name)}</h3><p>বর্তমান: ${N(p.qty)} ${p.unit}</p><input id="aq" type="number" inputmode="decimal" placeholder="নতুন কত ${p.unit} এলো?"><div class="row" style="margin-top:10px"><button class="btn o" onclick="closeModal()">বাতিল</button><button class="btn" onclick="doAdd('${id}')">যোগ করুন</button></div>`)}
function logIn(p,q){if(q>0){D.stockIn=D.stockIn||[];D.stockIn.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,qty:q,buy:p.buy,total:R2(q*p.buy)})}}
function delIn(id){const x=(D.stockIn||[]).find(y=>y.id==id);if(!x)return;modal(`<h3>এন্ট্রি মুছবেন?</h3><p>${E(x.name)} — ${N(x.qty)} · ৳${N(x.total)}</p><button class="btn w" style="margin-bottom:8px" onclick="editIn('${id}')">✏️ সংখ্যা ঠিক করুন (স্টক ও হিসাব দুটোই)</button><button class="btn o w" onclick="doDelIn('${id}',0)">শুধু হিসাব থেকে মুছুন (স্টক যেমন আছে থাকবে)</button><button class="btn r w" style="margin-top:8px" onclick="doDelIn('${id}',1)">হিসাব মুছুন ও স্টক ${N(x.qty)} কমান</button><button class="btn o w" style="margin-top:8px" onclick="closeModal()">বাতিল</button>`)}

<h4 style="margin:14px 0 6px">হিসাবের তালিকা</h4><div class="row" style="margin-bottom:8px">${[['day','দিন'],['week','সপ্তাহ'],['month','মাস']].map(r=>btn(r[0],grp,'grp',r[1])).join('')}</div>
<div class="card" style="overflow-x:auto"><table class="tb"><tr><th>সময়</th><th>বিক্রি</th><th>লাভ</th><th>নতুন বাকি</th><th>নতুন মাল</th>${grp=='day'?'<th>মাল (কেনা)</th>':''}</tr>${rows||'<tr><td colspan="6" class="mut">এখনো কোনো বিক্রি নেই</td></tr>'}</table></div>
<h4 style="margin:14px 0 6px">নতুন মাল আসার তালিকা</h4>${SI.length>1?`<button class="btn o w" style="margin-bottom:8px" onclick="delAllIn()">🗑 তালিকার সব মুছুন (শুধু হিসাব)</button>`:''}${SI.slice(0,50).map(x=>`<div class="card row sp"><span>${new Date(x.ts).toLocaleDateString('bn-BD')} · ${E(x.name)} (${N(x.qty)})</span><b class="f0">৳${N(x.total)}</b><button class="btn o f0" style="min-height:36px;padding:4px 10px" onclick="editIn('${x.id}')">✏️</button><button class="btn r f0" style="min-height:36px;padding:4px 10px" onclick="delIn('${x.id}')">✕</button></div>`).join('')||'<p class="mut">এই সময়ে নতুন মাল যোগ হয়নি</p>'}<h4 style="margin:14px 0 6px">বিলের তালিকা</h4>${L.map(s=>`<div class="card row sp" onclick="receipt('${s.id}')"><span>#${N(s.no)} · ${new Date(s.ts).toLocaleString('bn-BD',{dateStyle:'short',timeStyle:'short'})}</span><b class="f0">৳${N(s.total)}${s.due?' <span class="red">(বাকি '+N(s.due)+')</span>':''}</b></div>`).join('')||'<p class="mut">এই সময়ে কোনো বিল নেই</p>'}`)}

/* ---------- Backup ---------- */
let DL=null;try{window.claude&&window.claude.use('downloads').then(x=>DL=x,()=>{})}catch(e){}
function rBk(){A(`<div class="card"><label>দোকানের নাম</label><input value="${E(D.shop)}" onchange="D.shop=this.value.trim()||'আমার দোকান';save();$('#hd').textContent='🏪 '+D.shop"></div>
<div class="card"><p class="mut">সর্বশেষ ব্যাকআপ: ${D.lastBackup?new Date(D.lastBackup).toLocaleString('bn-BD'):'কখনো নয়'}</p><div class="row"><button class="btn" onclick="exp()">⬇ ডাউনলোড</button><button class="btn o" onclick="shareBk()">📤 শেয়ার</button></div><textarea id="bt" style="display:none;height:120px;margin-top:8px" readonly></textarea></div>
<div class="card"><label>ব্যাকআপ ইমপোর্ট</label><input type="file" accept=".json,application/json" onchange="imp(this.files[0])"><p class="mut">ইমপোর্ট করলে বর্তমান সব ডেটা বদলে যাবে।</p><textarea id="it" placeholder="অথবা ব্যাকআপের লেখা এখানে পেস্ট করুন" style="height:80px;margin-top:8px"></textarea><button class="btn o w" style="margin-top:8px" onclick="doImp($('#it').value)">লেখা থেকে ইমপোর্ট</button></div>
<div class="card"><b>ব্যবহার নির্দেশনা</b><p class="mut">📷 ক্যামেরা: ব্রাউজার অনুমতি চাইলে "Allow" দিন। না এলে সাইট সেটিংস → ক্যামেরা → Allow (HTTPS লাগবে)।<br>🔫 OTG/USB স্ক্যানার: OTG কেবলে ফোনে লাগান। এটি কিবোর্ডের মতো কাজ করে — "বিক্রি" ট্যাবের বারকোড ঘরে ট্যাপ করে স্ক্যান করুন (শেষে Enter পাঠায়)।</p></div>`)}
function exp(){const j=JSON.stringify(D,null,1),f='dokan-backup-'+dstr(Date.now())+'.json',
ok=()=>{D.lastBackup=Date.now();save();rBk()},
fb=()=>{const t=$('#bt');t.style.display='block';t.value=j;t.select();toast('লেখাটি কপি করে নিরাপদ জায়গায় রাখুন')};
if(DL)return DL.save({filename:f,data:j}).then(ok,e=>{if(e.code!='declined')fb()});
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);ok();toast('ডাউনলোড ফোল্ডারে সেভ হচ্ছে')}catch(e){fb()}}
function shareBk(){const f='dokan-backup-'+dstr(Date.now())+'.json';try{const file=new File([JSON.stringify(D)],f,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'দোকানের ব্যাকআপ'}).then(()=>{D.lastBackup=Date.now();save();rBk()},()=>{});else toast('এই ফোনে শেয়ার চলছে না — ডাউনলোড চাপুন')}catch(e){toast('শেয়ার করা যায়নি — ডাউনলোড চাপুন')}}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>doImp(r.result);r.onerror=()=>toast('ফাইল পড়া যায়নি');r.readAsText(f)}
function doImp(t){try{const o=JSON.parse(t);if(!Array.isArray(o.products)||!Array.isArray(o.sales))throw 0;ask('বর্তমান ডেটা মুছে ব্যাকআপ থেকে ফেরত আনবেন?',()=>{D=Object.assign({shop:'আমার দোকান',products:[],customers:[],sales:[],ledger:[],lastBackup:0},o);D.products.forEach(p=>{if(p.qty<0)p.qty=0});save();go('bk');toast('ইমপোর্ট সম্পন্ন')})}catch(e){toast('ব্যাকআপটি সঠিক নয়')}}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
(function(){let inF=true;try{inF=window.top!==window}catch(e){}if(inF||!history.pushState)return;
const push=()=>{try{history.pushState({s:1},'')}catch(e){}};let tm;
try{history.replaceState({s:0},'');push()}catch(e){return}
window.addEventListener('popstate',()=>{let h=1;
if($('#cam').innerHTML){if(qr)stopScan();else if(ns)stopNative();else $('#cam').innerHTML=''}
else if($('#modal').innerHTML)closeModal();
else if(tabHist.length)go(tabHist.pop(),1);
else h=0;
if(h)return push();
toast('বেরোতে আবার ব্যাক চাপুন');clearTimeout(tm);tm=setTimeout(()=>{if(history.state&&history.state.s===0)push()},2200)});
document.addEventListener('pointerdown',()=>{if(history.state&&history.state.s===0)push()},true)})();
go('pos');
</script></body></html>
